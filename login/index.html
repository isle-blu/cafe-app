<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Cafe Isle</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <!-- 헤더 (상단 스티키) -->
  <header class="page-header glass">
    <a href="../index.html" class="icon-btn back-link" aria-label="메인으로">
      <i class="fa-solid fa-arrow-left" style="font-size: 20px;"></i>
    </a>
    <div class="header-text">
      <h1>로그인</h1>
      <p>Cafe Isle에 오신 것을 환영합니다</p>
    </div>
    <div class="header-controls">
      <!-- 테마 토글 스위치 -->
      <div class="theme-toggle-wrapper">
        <label class="switch">
          <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
          <span class="slider round">
            <span class="handle">
              <span class="icon-sun">
                <i class="fa-solid fa-sun" style="font-size: 14px;"></i>
              </span>
              <span class="icon-moon">
                <i class="fa-solid fa-moon" style="font-size: 14px;"></i>
              </span>
            </span>
          </span>
        </label>
      </div>
    </div>
  </header>

  <!-- 로그인 컨테이너 -->
  <main class="login-container">
    <div class="login-card-wrapper">
      <div class="login-card glass">
        <!-- 로고 및 타이틀 -->
        <div class="login-brand">
          <div class="brand-logo">
            <i class="fa-solid fa-mug-hot"></i>
          </div>
          <h2>Cafe Isle</h2>
          <p>따뜻한 커피와 일상이 머무는 곳</p>
        </div>

        <!-- 단일 로그인 폼 -->
        <div class="forms-container">
          <form id="unified-login-form" class="login-form active">
            <div class="form-group">
              <div class="input-wrapper">
                <input type="text" id="login-id" required placeholder="아이디 또는 이름" autocomplete="username" />
              </div>
            </div>
            <div class="form-group">
              <div class="input-wrapper">
                <input type="password" id="login-credential" required placeholder="비밀번호 또는 이메일" autocomplete="current-password" />
              </div>
            </div>

            <button type="submit" class="btn-login-submit">로그인</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- 푸터 -->
  <footer class="main-footer">
    <div class="footer-content">
      <p class="copyright">© 2026 Cafe Isle. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="index.js"></script>
</body>
</html>
