<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 - Cafe Isle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="list.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <header class="page-header glass">
    <a href="../index.html" class="icon-btn back-link" aria-label="메인으로">
      <i class="fa-solid fa-arrow-left" style="font-size: 20px;"></i>
    </a>
    <div class="header-text">
      <h1>메뉴</h1>
      <p>오늘 마시고 싶은 메뉴를 골라보세요</p>
    </div>
    <div class="header-controls">
      <!-- 테마 토글 스위치 -->
      <div class="theme-toggle-wrapper">
        <label class="switch">
          <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
          <span class="slider round">
            <span class="handle">
              <span class="icon-sun">
                <i class="fa-solid fa-sun" style="font-size: 14px;"></i>
              </span>
              <span class="icon-moon">
                <i class="fa-solid fa-moon" style="font-size: 14px;"></i>
              </span>
            </span>
          </span>
        </label>
      </div>
      <a href="../basket/list.html" class="icon-btn header-cart" aria-label="장바구니">
        <span class="cart-icon">
          <i class="fa-solid fa-cart-shopping" style="font-size: 20px;"></i>
        </span>
        <span class="cart-badge" id="cart-badge" data-count="0">0</span>
      </a>
      <a href="../my/index.html" class="icon-btn header-my" aria-label="마이페이지">
        <span class="my-icon">
          <i class="fa-solid fa-user" style="font-size: 20px;"></i>
        </span>
      </a>
    </div>
  </header>

  <nav class="category-tabs" id="category-tabs"></nav>

  <div class="page-body">
    <aside class="category-sidebar glass" id="category-sidebar"></aside>
    <main class="menu-grid" id="menu-grid"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="list.js"></script>
</body>
</html>
