<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 수정 - Cafe Isle 관리자</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="edit.css">
  <script src="../../js/theme.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 사이드바 / 네비게이션 -->
    <aside class="admin-sidebar glass">
      <div class="sidebar-brand-wrapper">
        <div class="sidebar-brand">
          <span class="brand-emoji" style="display: flex; align-items: center; justify-content: center; height: 32px;">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
          </span>
          <h1 class="brand-title">Cafe Isle</h1>
        </div>
        <span class="admin-mode-label">관리자 모드</span>
      </div>
      <nav class="sidebar-menu">
        <a href="../index.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </span> 대시보드
        </a>
        <a href="list.html" class="menu-item active">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </span> 메뉴 관리
        </a>
        <a href="../orders/list.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </span> 주문 관리
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg> 고객 홈 바로가기
        </a>
      </div>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="admin-main">
      <header class="main-header glass">
        <div class="header-info">
          <h2>메뉴 수정</h2>
          <p>기존 등록된 메뉴의 정보를 수정하고 변경사항을 저장합니다.</p>
        </div>
        <div class="header-actions">

          <a href="list.html" class="btn btn-secondary" id="backBtn">
            <span>⬅️</span> 취소
          </a>
        </div>
      </header>

      <!-- 메뉴 수정 폼 카드 -->
      <section class="form-section glass" id="formWrapper">
        <form id="menuForm" class="menu-form">
          
          <div class="form-group-grid">
            <!-- 메뉴 이름 -->
            <div class="form-group">
              <label for="name">메뉴 이름 <span class="required">*</span></label>
              <input type="text" id="name" name="name" required>
              <span class="error-text" id="nameError"></span>
            </div>

            <!-- 카테고리 -->
            <div class="form-group">
              <label for="categoryId">카테고리 <span class="required">*</span></label>
              <select id="categoryId" name="categoryId" required>
                <option value="" disabled>카테고리를 선택하세요</option>
                <!-- JS로 동적 로드 -->
              </select>
              <span class="error-text" id="categoryError"></span>
            </div>

            <!-- 가격 -->
            <div class="form-group">
              <label for="price">판매 가격 (원) <span class="required">*</span></label>
              <input type="number" id="price" name="price" min="0" step="100" required>
              <span class="error-text" id="priceError"></span>
            </div>

            <!-- 이미지 URL -->
            <div class="form-group">
              <label for="image">이미지 URL</label>
              <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg (미입력 시 기본 이미지 적용)">
              <span class="error-text" id="imageError"></span>
            </div>
          </div>

          <!-- 메뉴 설명 -->
          <div class="form-group">
            <label for="description">메뉴 설명</label>
            <textarea id="description" name="description" rows="4"></textarea>
          </div>

          <!-- 옵션 체크박스 그룹 -->
          <div class="form-group">
            <label>상품 상태 및 옵션 설정</label>
            <div class="checkbox-group glass">
              <label class="checkbox-label">
                <input type="checkbox" id="hasTemperatureOption" name="hasTemperatureOption">
                <span class="checkbox-custom"></span>
                <span class="label-text">온도 옵션 제공 (ICE / HOT 구분 선택 가능)</span>
              </label>
              
              <label class="checkbox-label">
                <input type="checkbox" id="isPopular" name="isPopular">
                <span class="checkbox-custom"></span>
                <span class="label-text">인기 상품으로 등록 🔥 (메뉴 카드에 '인기' 뱃지 노출)</span>
              </label>
              
              <label class="checkbox-label">
                <input type="checkbox" id="isNew" name="isNew">
                <span class="checkbox-custom"></span>
                <span class="label-text">신규 상품으로 등록 ✨ (메뉴 카드에 '신규' 뱃지 노출)</span>
              </label>
            </div>
          </div>

          <!-- 등록 / 취소 버튼 -->
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancelBtn">
              취소
            </button>
            <button type="submit" class="btn btn-primary">
              💾 수정 완료하기
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="edit.js" defer></script>
</body>
</html>
