<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - Cafe Isle</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 사이드바 -->
    <aside class="admin-sidebar glass">
      <div class="sidebar-brand-wrapper">
        <div class="sidebar-brand-row">
          <div class="sidebar-brand">
            <span class="brand-emoji" style="display: flex; align-items: center; justify-content: center; height: 32px;">
              <i class="fa-solid fa-mug-hot" style="font-size: 24px;"></i>
            </span>
            <h1 class="brand-title">Cafe Isle</h1>
          </div>
          <!-- 다크모드 토글 스위치 -->
          <div class="theme-toggle-wrapper">
            <label class="switch">
              <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
              <span class="slider round">
                <span class="handle">
                  <span class="icon-sun">
                    <i class="fa-solid fa-sun" style="font-size: 10px;"></i>
                  </span>
                  <span class="icon-moon">
                    <i class="fa-solid fa-moon" style="font-size: 10px;"></i>
                  </span>
                </span>
              </span>
            </label>
          </div>
        </div>
        <span class="admin-mode-label">관리자 모드</span>
      </div>
      <nav class="sidebar-menu">
        <a href="index.html" class="menu-item active">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-gauge" style="font-size: 18px;"></i>
          </span> 대시보드
        </a>
        <a href="menus/list.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-list-ul" style="font-size: 18px;"></i>
          </span> 메뉴 관리
        </a>
        <a href="orders/list.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-receipt" style="font-size: 18px;"></i>
          </span> 주문 관리
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-house" style="font-size: 14px;"></i> 고객 홈 바로가기
        </a>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="admin-main">
      <header class="main-header glass" style="padding: var(--spacing-md) var(--spacing-lg);">
        <!-- 마이페이지 프로필 카드 스타일의 상시 노출형 관리자 프로필 영역 -->
        <div class="admin-profile-card-full">
          <div class="profile-avatar-container">
            <div class="profile-avatar">👑</div>
          </div>
          <div class="profile-info">
            <div class="name-badge-wrapper">
              <h2 class="profile-name">admin</h2>
              <span class="user-grade-badge grade-owner">사장</span>
            </div>
            <p class="profile-email">owner@cafeisle.com</p>
          </div>
          <!-- 로그아웃 버튼 -->
          <button class="btn-session-reset-direct" id="btn-session-reset-action" title="로그아웃">
            <i class="fa-solid fa-right-from-bracket" style="font-size: 13px; margin-right: 6px;"></i>
            로그아웃
          </button>
        </div>
      </header>

      <!-- 현황 요약 카드 -->
      <section class="metrics-grid">
        <div class="metric-card glass">
          <div class="metric-icon income">
            <i class="fa-solid fa-coins" style="font-size: 24px; color: white;"></i>
          </div>
          <div class="metric-info">
            <span class="metric-label">오늘의 매출</span>
            <h3 class="metric-value" id="today-sales">0원</h3>
          </div>
        </div>

        <div class="metric-card glass">
          <div class="metric-icon orders">
            <i class="fa-solid fa-receipt" style="font-size: 24px; color: white;"></i>
          </div>
          <div class="metric-info">
            <span class="metric-label">오늘의 주문</span>
            <h3 class="metric-value" id="today-orders-count">0건</h3>
          </div>
        </div>

        <div class="metric-card glass">
          <div class="metric-icon waiting">
            <i class="fa-solid fa-clock" style="font-size: 24px; color: white;"></i>
          </div>
          <div class="metric-info">
            <span class="metric-label">제조/준비 대기중</span>
            <h3 class="metric-value" id="waiting-orders-count">0건</h3>
          </div>
        </div>

        <div class="metric-card glass">
          <div class="metric-icon menus">
            <i class="fa-solid fa-mug-hot" style="font-size: 24px; color: white;"></i>
          </div>
          <div class="metric-info">
            <span class="metric-label">등록 메뉴 수</span>
            <h3 class="metric-value" id="total-menus-count">0개</h3>
          </div>
        </div>
      </section>

      <!-- 상세 리스트 및 통계 2열 분할 -->
      <div class="dashboard-details-grid">
        <!-- 1열: 실시간 주문 관리 -->
        <section class="live-orders-card glass">
          <div class="section-title-bar">
            <h3>실시간 주문 관리</h3>
            <span class="status-indicator-badge live">LIVE</span>
          </div>
          <div class="table-wrapper">
            <table class="live-orders-table">
              <thead>
                <tr>
                  <th>주문번호</th>
                  <th>일시</th>
                  <th>주문 품목</th>
                  <th>결제금액</th>
                  <th>상태 제어</th>
                </tr>
              </thead>
              <tbody id="live-orders-tbody">
                <!-- JS에서 동적 바인딩 -->
                <tr>
                  <td colspan="5" class="empty-table">현재 처리해야 할 주문이 없습니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 2열: 통계 그래프 및 인기 메뉴 -->
        <div class="statistics-column">
          <!-- 주간 매출 분석 차트 -->
          <section class="sales-chart-card glass">
            <h3 class="card-title">최근 7일간 매출 현황</h3>
            <div class="chart-wrapper">
              <div class="chart-container" id="sales-bar-chart">
                <!-- JS에서 바 차트 동적 생성 -->
              </div>
            </div>
          </section>

          <!-- 인기 메뉴 Top 5 -->
          <section class="popular-menus-card glass">
            <h3 class="card-title">인기 메뉴 Top 5</h3>
            <div class="popular-list" id="popular-menus-list">
              <!-- JS에서 동적 인기 리스트 바인딩 -->
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <!-- 데이터 파일들 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <!-- 로직 스크립트 로드 -->
  <script src="index.js"></script>
</body>
</html>
