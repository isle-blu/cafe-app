<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 - Cafe Isle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="list.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <header class="page-header glass">
    <a href="../index.html" class="icon-btn back-link" aria-label="메인으로">
      <span aria-hidden="true">←</span>
    </a>
    <div class="header-text">
      <h1>메뉴</h1>
      <p>오늘 마시고 싶은 메뉴를 골라보세요</p>
    </div>
    <!-- 테마 토글 스위치 -->
    <div class="theme-toggle-wrapper">
      <label class="switch">
        <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
        <span class="slider round">
          <span class="icon-sun">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="icon-moon">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </span>
      </label>
    </div>
    <a href="../basket/list.html" class="icon-btn header-cart" aria-label="장바구니">
      <span class="cart-icon">🛒</span>
      <span class="cart-badge" id="cart-badge" data-count="0">0</span>
    </a>
  </header>

  <nav class="category-tabs" id="category-tabs"></nav>

  <div class="page-body">
    <aside class="category-sidebar glass" id="category-sidebar"></aside>
    <main class="menu-grid" id="menu-grid"></main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="list.js"></script>
</body>
</html>
