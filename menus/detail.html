<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메뉴 상세 - Cafe Isle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="detail.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <header class="page-header glass">
    <a href="list.html" class="icon-btn back-link" aria-label="목록으로">
      <i class="fa-solid fa-arrow-left" style="font-size: 20px;"></i>
    </a>
    <h1>메뉴 상세</h1>
    <div class="header-controls">
      <!-- 테마 토글 스위치 -->
      <div class="theme-toggle-wrapper">
        <label class="switch">
          <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
          <span class="slider round">
            <span class="handle">
              <span class="icon-sun">
                <i class="fa-solid fa-sun" style="font-size: 14px;"></i>
              </span>
              <span class="icon-moon">
                <i class="fa-solid fa-moon" style="font-size: 14px;"></i>
              </span>
            </span>
          </span>
        </label>
      </div>
      <a href="../basket/list.html" class="icon-btn header-cart" aria-label="장바구니">
        <span class="cart-icon">
          <i class="fa-solid fa-cart-shopping" style="font-size: 20px;"></i>
        </span>
        <span class="cart-badge" id="cart-badge" data-count="0">0</span>
      </a>
      <a href="../my/index.html" class="icon-btn header-my" aria-label="마이페이지">
        <span class="my-icon">
          <i class="fa-solid fa-user" style="font-size: 20px;"></i>
        </span>
      </a>
    </div>
  </header>

  <main id="menu-detail"></main>

  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="detail.js"></script>
</body>
</html>
