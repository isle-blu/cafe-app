<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 상세 - Cafe Isle 관리자</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="detail.css">
  <script src="../../js/theme.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 사이드바 / 네비게이션 -->
    <aside class="admin-sidebar glass">
      <div class="sidebar-brand">
        <span class="brand-emoji" style="display: flex; align-items: center; justify-content: center; height: 32px;">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </span>
        <h1 class="brand-title">Cafe Admin</h1>
      </div>
      <nav class="sidebar-menu">
        <a href="../index.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </span> 대시보드
        </a>
        <a href="list.html" class="menu-item active">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </span> 메뉴 관리
        </a>

      </nav>
      <div class="sidebar-footer">
        <a href="../../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg> 고객 홈 바로가기
        </a>
      </div>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="admin-main">
      <header class="main-header glass">
        <div class="header-info">
          <h2>메뉴 상세 정보</h2>
          <p>등록된 메뉴의 세부 내용을 조회합니다.</p>
        </div>
        <div class="header-actions">
          <!-- 테마 토글 스위치 -->
          <div class="theme-toggle-wrapper" style="margin-right: 12px;">
            <label class="switch">
              <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
              <span class="slider round">
                <span class="handle">
                  <span class="icon-sun">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="5"></circle>
                      <line x1="12" y1="1" x2="12" y2="3"></line>
                      <line x1="12" y1="21" x2="12" y2="23"></line>
                      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                      <line x1="1" y1="12" x2="3" y2="12"></line>
                      <line x1="21" y1="12" x2="23" y2="12"></line>
                      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                  </span>
                  <span class="icon-moon">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                  </span>
                </span>
              </span>
            </label>
          </div>
          <a href="list.html" class="btn btn-secondary">
            <span>⬅️</span> 목록으로
          </a>
        </div>
      </header>

      <!-- 메뉴 상세 정보 카드 -->
      <section class="detail-section glass" id="detailCard">
        <!-- JS로 동적 생성 -->
        <div class="loading">정보를 불러오는 중입니다...</div>
      </section>
    </main>
  </div>

  <!-- 삭제 확인 커스텀 모달 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>🚨 메뉴 삭제</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p>정말로 이 메뉴를 삭제하시겠습니까?</p>
        <p class="modal-warn">삭제된 메뉴는 복구할 수 없습니다.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeDeleteModal()">취소</button>
        <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">삭제</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="detail.js" defer></script>
</body>
</html>
