<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 관리 - Cafe Isle 관리자</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="list.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../../js/theme.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 사이드바 / 네비게이션 -->
    <aside class="admin-sidebar glass">
      <div class="sidebar-brand-wrapper">
        <div class="sidebar-brand-row">
          <div class="sidebar-brand">
            <span class="brand-emoji" style="display: flex; align-items: center; justify-content: center; height: 32px;">
              <i class="fa-solid fa-mug-hot" style="font-size: 24px;"></i>
            </span>
            <h1 class="brand-title">Cafe Isle</h1>
          </div>
          <!-- 다크모드 토글 스위치 -->
          <div class="theme-toggle-wrapper">
            <label class="switch">
              <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
              <span class="slider round">
                <span class="handle">
                  <span class="icon-sun">
                    <i class="fa-solid fa-sun" style="font-size: 10px;"></i>
                  </span>
                  <span class="icon-moon">
                    <i class="fa-solid fa-moon" style="font-size: 10px;"></i>
                  </span>
                </span>
              </span>
            </label>
          </div>
        </div>
        <span class="admin-mode-label">관리자 모드</span>
      </div>
      <nav class="sidebar-menu">
        <a href="../index.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-gauge" style="font-size: 18px;"></i>
          </span> 대시보드
        </a>
        <a href="list.html" class="menu-item active">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-list-ul" style="font-size: 18px;"></i>
          </span> 메뉴 관리
        </a>
        <a href="../orders/list.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-receipt" style="font-size: 18px;"></i>
          </span> 주문 관리
        </a>

      </nav>
      <div class="sidebar-footer">
        <a href="../../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-house" style="font-size: 14px;"></i> 고객 홈 바로가기
        </a>
      </div>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="admin-main">
      <header class="main-header glass">
        <div class="header-info">
          <h2>메뉴 관리</h2>
          <p>등록된 전체 메뉴를 조회하고 관리합니다.</p>
        </div>
        <div class="header-actions">

          <a href="create.html" class="btn btn-primary">
            <i class="fa-solid fa-plus" style="margin-right: 6px;"></i> 새 메뉴 등록
          </a>
        </div>
      </header>

      <!-- 필터 및 검색 바 -->
      <section class="filter-section glass">
        <div class="category-filters" id="categoryFilters">
          <button class="filter-btn active" data-category="all">전체</button>
          <!-- JS로 카테고리 로드 및 활성화 처리 -->
        </div>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="메뉴 이름을 검색하세요...">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        </div>
        <div class="view-toggle" id="viewToggle">
          <button class="toggle-btn" data-view="grid" title="그리드 뷰"><i class="fa-solid fa-table-cells-large" style="margin-right: 6px;"></i>그리드</button>
          <button class="toggle-btn" data-view="list" title="리스트 뷰"><i class="fa-solid fa-list" style="margin-right: 6px;"></i>리스트</button>
        </div>
      </section>

      <!-- 메뉴 목록 그리드 -->
      <section class="menu-grid-section">
        <div class="list-header" id="listHeader">
          <div class="col-img">이미지</div>
          <div class="col-info">
            <div class="col-name">메뉴명</div>
            <div class="col-category">카테고리</div>
            <div class="col-meta">가격 / 옵션</div>
          </div>
          <div class="col-actions">관리</div>
        </div>
        <div class="menu-grid" id="menuGrid">
          <!-- JS로 동적 생성 -->
        </div>
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon"><i class="fa-solid fa-mug-hot" style="font-size: 48px; color: var(--color-text-light);"></i></div>
          <h3>등록된 메뉴가 없습니다</h3>
          <p>새로운 메뉴를 등록해 보세요!</p>
          <a href="create.html" class="btn btn-primary btn-sm">메뉴 추가하기</a>
        </div>
      </section>
    </main>
  </div>

  <!-- 삭제 확인 커스텀 모달 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-content glass">
      <div class="modal-header">
        <h3><i class="fa-solid fa-triangle-exclamation" style="color: var(--color-danger); margin-right: 6px;"></i> 메뉴 삭제</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p>정말로 '<span id="deleteTargetName"></span>' 메뉴를 삭제하시겠습니까?</p>
        <p class="modal-warn">삭제된 메뉴는 복구할 수 없습니다.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeDeleteModal()">취소</button>
        <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">삭제</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="list.js" defer></script>
</body>
</html>
