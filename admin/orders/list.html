<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 관리 - Cafe Isle 관리자</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="list.css">
  <script src="../../js/theme.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 사이드바 -->
    <aside class="admin-sidebar glass">
      <div class="sidebar-brand-wrapper">
        <div class="sidebar-brand-row">
          <div class="sidebar-brand">
            <span class="brand-emoji" style="display: flex; align-items: center; justify-content: center; height: 32px;">
              <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                <line x1="6" y1="1" x2="6" y2="4"></line>
                <line x1="10" y1="1" x2="10" y2="4"></line>
                <line x1="14" y1="1" x2="14" y2="4"></line>
              </svg>
            </span>
            <h1 class="brand-title">Cafe Isle</h1>
          </div>
          <!-- 다크모드 토글 스위치 -->
          <div class="theme-toggle-wrapper">
            <label class="switch">
              <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
              <span class="slider round">
                <span class="handle">
                  <span class="icon-sun">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="5"></circle>
                      <line x1="12" y1="1" x2="12" y2="3"></line>
                      <line x1="12" y1="21" x2="12" y2="23"></line>
                      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                      <line x1="1" y1="12" x2="3" y2="12"></line>
                      <line x1="21" y1="12" x2="23" y2="12"></line>
                      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                  </span>
                  <span class="icon-moon">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                  </span>
                </span>
              </span>
            </label>
          </div>
        </div>
        <span class="admin-mode-label">관리자 모드</span>
      </div>
      <nav class="sidebar-menu">
        <a href="../index.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </span> 대시보드
        </a>
        <a href="../menus/list.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </span> 메뉴 관리
        </a>
        <a href="list.html" class="menu-item active">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </span> 주문 관리
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg> 고객 홈 바로가기
        </a>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="admin-main">
      <header class="main-header glass">
        <div class="header-info">
          <h2>주문 관리</h2>
          <p>전체 고객들의 주문 상태를 모니터링하고 가맹 주문 처리를 관리합니다.</p>
        </div>
        <div class="header-actions">

        </div>
      </header>

      <!-- 검색 및 필터 패널 -->
      <section class="filter-panel glass">
        <div class="filter-group search-box">
          <label for="search-order-id">주문번호 검색</label>
          <input type="text" id="search-order-id" placeholder="주문 번호를 입력하세요 (예: 1001)" />
        </div>
        
        <div class="filter-group select-box">
          <label for="filter-status">주문 상태 필터</label>
          <select id="filter-status">
            <option value="ALL">전체 보기</option>
            <option value="준비중">준비중</option>
            <option value="제조중">제조중</option>
            <option value="수령완료">수령완료</option>
            <option value="주문취소">주문취소</option>
          </select>
        </div>

        <div class="filter-group view-mode-box">
          <label>보기 형식</label>
          <div class="view-toggle" id="viewToggle">
            <button class="toggle-btn active" id="btn-view-table" data-view="list" title="리스트 뷰">📝 리스트</button>
            <button class="toggle-btn" id="btn-view-ticket" data-view="grid" title="그리드 뷰">📱 그리드</button>
          </div>
        </div>
      </section>

      <!-- 1. 주문 내역 테이블 카드 (기존 테이블 뷰) -->
      <section class="orders-list-card glass" id="orders-table-view">
        <div class="table-wrapper">
          <table class="orders-table">
            <thead>
              <tr>
                <th>주문번호</th>
                <th>주문일시</th>
                <th>주문 내역 요약</th>
                <th>총 수량</th>
                <th>결제금액</th>
                <th>상태 제어</th>
                <th>액션</th>
              </tr>
            </thead>
            <tbody id="orders-list-tbody">
              <!-- JS에서 동적 렌더링 -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- 2. 주문서 티켓형 보드 뷰 (신규 주방 주문서 뷰) -->
      <section class="orders-board-view" id="orders-ticket-view" style="display: none;">
        <div class="tickets-grid" id="orders-tickets-container">
          <!-- JS에서 동적 렌더링 (영수증 모양 카드들) -->
        </div>
      </section>
    </main>
  </div>

  <!-- 데이터 파일 로드 -->
  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <!-- 스크립트 로드 -->
  <script src="list.js"></script>
</body>
</html>
