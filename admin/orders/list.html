<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 관리 - Cafe Isle 관리자</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="list.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../../js/theme.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- 사이드바 -->
    <aside class="admin-sidebar glass">
      <div class="sidebar-brand-wrapper">
        <div class="sidebar-brand-row">
          <div class="sidebar-brand">
            <span class="brand-emoji" style="display: flex; align-items: center; justify-content: center; height: 32px;">
              <i class="fa-solid fa-mug-hot" style="font-size: 24px;"></i>
            </span>
            <h1 class="brand-title">Cafe Isle</h1>
          </div>
          <!-- 다크모드 토글 스위치 -->
          <div class="theme-toggle-wrapper">
            <label class="switch">
              <input type="checkbox" id="theme-toggle-btn" aria-label="다크 모드 토글" />
              <span class="slider round">
                <span class="handle">
                  <span class="icon-sun">
                    <i class="fa-solid fa-sun" style="font-size: 10px;"></i>
                  </span>
                  <span class="icon-moon">
                    <i class="fa-solid fa-moon" style="font-size: 10px;"></i>
                  </span>
                </span>
              </span>
            </label>
          </div>
        </div>
        <span class="admin-mode-label">관리자 모드</span>
      </div>
      <nav class="sidebar-menu">
        <a href="../index.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-gauge" style="font-size: 18px;"></i>
          </span> 대시보드
        </a>
        <a href="../menus/list.html" class="menu-item">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-list-ul" style="font-size: 18px;"></i>
          </span> 메뉴 관리
        </a>
        <a href="list.html" class="menu-item active">
          <span class="menu-icon" style="display: flex; align-items: center; margin-right: 8px;">
            <i class="fa-solid fa-receipt" style="font-size: 18px;"></i>
          </span> 주문 관리
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="../../index.html" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-house" style="font-size: 14px;"></i> 고객 홈 바로가기
        </a>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="admin-main">
      <header class="main-header glass">
        <div class="header-info">
          <h2>주문 관리</h2>
          <p>전체 고객들의 주문 상태를 모니터링하고 가맹 주문 처리를 관리합니다.</p>
        </div>
        <div class="header-actions">

        </div>
      </header>

      <!-- 검색 및 필터 패널 -->
      <section class="filter-panel glass">
        <div class="filter-group search-box">
          <label for="search-order-id">주문번호 검색</label>
          <input type="text" id="search-order-id" placeholder="주문 번호를 입력하세요 (예: 1001)" />
        </div>
        
        <div class="filter-group select-box">
          <label for="filter-status">필터</label>
          <select id="filter-status">
            <option value="ALL">전체 보기</option>
            <option value="준비중">준비중</option>
            <option value="제조중">제조중</option>
            <option value="수령완료">수령완료</option>
            <option value="주문취소">주문취소</option>
          </select>
        </div>

        <div class="filter-group view-mode-box">
          <label>보기 형식</label>
          <div class="view-toggle" id="viewToggle">
            <button class="toggle-btn active" id="btn-view-table" data-view="list" title="리스트 뷰"><i class="fa-solid fa-list" style="margin-right: 6px;"></i>리스트</button>
            <button class="toggle-btn" id="btn-view-ticket" data-view="grid" title="그리드 뷰"><i class="fa-solid fa-table-cells-large" style="margin-right: 6px;"></i>그리드</button>
          </div>
        </div>
      </section>

      <!-- 1. 주문 내역 테이블 카드 (기존 테이블 뷰) -->
      <section class="orders-table-view-container" id="orders-table-view">
        <!-- 진행 중인 주문 -->
        <div class="orders-list-card glass">
          <div class="card-header-simple" style="padding: var(--spacing-md) var(--spacing-lg) 0 var(--spacing-lg);">
            <h3 class="section-subtitle" style="font-size: var(--font-size-sm); font-weight: 700; color: var(--color-primary-dark); display: flex; align-items: center; gap: 6px;">
              <span>🔥</span> 진행 중인 주문
            </h3>
          </div>
          <div class="table-wrapper">
            <table class="orders-table">
              <thead>
                <tr>
                  <th>주문번호</th>
                  <th>주문일시</th>
                  <th>주문 내역 요약</th>
                  <th>총 수량</th>
                  <th>결제금액</th>
                  <th>상태 제어</th>
                  <th>액션</th>
                </tr>
              </thead>
              <tbody id="orders-list-tbody-active">
                <!-- JS에서 동적 렌더링 -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- 구분선 -->
        <hr class="section-divider">

        <!-- 완료/취소된 주문 -->
        <div class="orders-list-card glass" style="opacity: 0.8;">
          <div class="card-header-simple" style="padding: var(--spacing-md) var(--spacing-lg) 0 var(--spacing-lg);">
            <h3 class="section-subtitle" style="font-size: var(--font-size-sm); font-weight: 700; color: var(--color-text-light); display: flex; align-items: center; gap: 6px;">
              <span>✅</span> 완료 및 취소된 주문
            </h3>
          </div>
          <div class="table-wrapper">
            <table class="orders-table">
              <thead>
                <tr>
                  <th>주문번호</th>
                  <th>주문일시</th>
                  <th>주문 내역 요약</th>
                  <th>총 수량</th>
                  <th>결제금액</th>
                  <th>상태 제어</th>
                  <th>액션</th>
                </tr>
              </thead>
              <tbody id="orders-list-tbody-history">
                <!-- JS에서 동적 렌더링 -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 2. 주문서 티켓형 보드 뷰 (신규 주방 주문서 뷰) -->
      <section class="orders-board-view" id="orders-ticket-view" style="display: none;">
        <div class="board-section-group">
          <h3 class="section-subtitle" style="font-size: var(--font-size-sm); font-weight: 700; color: var(--color-primary-dark); margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: 6px;">
            <span>🔥</span> 진행 중인 주방 주문서
          </h3>
          <div class="tickets-grid" id="orders-tickets-container-active">
            <!-- JS에서 동적 렌더링 (영수증 모양 카드들) -->
          </div>
        </div>

        <!-- 구분선 -->
        <hr class="section-divider">

        <div class="board-section-group">
          <h3 class="section-subtitle" style="font-size: var(--font-size-sm); font-weight: 700; color: var(--color-text-light); margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: 6px;">
            <span>✅</span> 완료 및 취소된 주문서
          </h3>
          <div class="tickets-grid" id="orders-tickets-container-history" style="opacity: 0.75;">
            <!-- JS에서 동적 렌더링 (영수증 모양 카드들) -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 데이터 파일 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <!-- 스크립트 로드 -->
  <script src="list.js"></script>
</body>
</html>
